networks:
  static-network:
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  server:
    build:
      context: ./MQTTClient
      target: final
    ports:
      - 8111:8111
    env_file:
      - "./DB/influxdb.env"
    develop:
      watch:
        - path: ./MQTTClient
          action: rebuild
    networks:
      static-network:
        ipv4_address: 172.20.0.4
  api:
    build:
      context: ./APIServer
    ports:
      - 7080:7080
    env_file:
      - "./DB/influxdb.env"
    develop:
      watch:
        - path: ./APIServer
          action: rebuild
    networks:
      static-network:
        ipv4_address: 172.20.0.5
  influxdb:
    image: influxdb:2.0.7
    env_file:
      - "./DB/influxdb.env"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: iot
      DOCKER_INFLUXDB_INIT_BUCKET: weather
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      - "8086:8086"
    networks:
      static-network:
        ipv4_address: 172.20.0.3